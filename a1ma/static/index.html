<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a1ma</title>
<style>
  :root {
    --bg: #0a0c12; --bg2: #0f121b; --bg3: #151a26; --bg4: #1b2130;
    --border: #212839; --border2: #2c3550;
    --fg: #e4e8f1; --dim: #7d879c; --faint: #4e586e;
    --accent: #7aa2f7; --accent2: #a78bfa; --cyan: #6fd6e8;
    --green: #8fe3a8; --red: #ff7a90; --yellow: #f5c26b;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", monospace;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14.5px/1.6 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex; flex-direction: column;
    background-image:
      radial-gradient(900px 400px at 15% -10%, rgba(122,162,247,.10), transparent 60%),
      radial-gradient(700px 350px at 90% 0%, rgba(167,139,250,.08), transparent 60%);
  }
  ::selection { background: rgba(122,162,247,.35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 20px;
    background: rgba(15,18,27,.75);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-right: 8px; user-select: none; }
  .brand .mark {
    width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #0a0c12; font-weight: 800; font-size: 15px;
    box-shadow: 0 4px 16px rgba(122,162,247,.25);
  }
  .brand .name { font-weight: 700; font-size: 16px; letter-spacing: .3px; }
  .brand .name span { color: var(--dim); font-weight: 500; }

  .picker { position: relative; display: flex; align-items: center; }
  select {
    appearance: none; -webkit-appearance: none;
    background: var(--bg3); color: var(--fg);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 7px 30px 7px 12px; font-size: 12.5px; font-family: var(--mono);
    cursor: pointer; max-width: 260px; text-overflow: ellipsis;
    transition: border-color .15s, background .15s;
  }
  select:hover { border-color: var(--border2); background: var(--bg4); }
  select:focus { outline: none; border-color: var(--accent); }
  .picker::after {
    content: ""; position: absolute; right: 11px; pointer-events: none;
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 5px solid var(--dim);
  }
  #provider { max-width: 130px; color: var(--cyan); border-color: rgba(111,214,232,.25); }
  #provider:hover { border-color: rgba(111,214,232,.5); }

  .spacer { flex: 1; }
  .iconbtn {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; color: var(--dim);
    border: 1px solid transparent; border-radius: 9px;
    padding: 7px 11px; font-size: 12.5px; font-family: inherit;
    cursor: pointer; transition: all .15s;
  }
  .iconbtn:hover { color: var(--fg); background: var(--bg3); border-color: var(--border); }
  .iconbtn.active { color: var(--green); border-color: rgba(143,227,168,.35); background: rgba(143,227,168,.08); }
  .iconbtn.danger:hover { color: var(--red); border-color: rgba(255,122,144,.35); }

  #chat { flex: 1; overflow-y: auto; padding: 28px 0 12px; scroll-behavior: smooth; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 22px; }

  .row { display: flex; margin: 0 0 18px; }
  .row.user { justify-content: flex-end; }
  .msg { white-space: pre-wrap; word-wrap: break-word; max-width: 100%; }
  .msg .who {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--faint); margin-bottom: 5px; display: flex; align-items: center; gap: 6px;
  }
  .msg.user {
    max-width: 82%; background: linear-gradient(180deg, #1a2233, #161d2b);
    border: 1px solid var(--border2); border-radius: 14px 14px 4px 14px;
    padding: 10px 14px;
  }
  .msg.assistant { width: 100%; }
  .msg.assistant .who { color: var(--accent); }
  .msg.assistant .who::before { content: "◆"; color: var(--cyan); font-size: 10px; }
  .msg.assistant .body { font-size: 14.5px; }
  .msg.error .who { color: var(--red); }
  .msg.error .body { color: #ffb3c0; font-family: var(--mono); font-size: 12.5px; }

  p { margin: 0 0 10px; } p:last-child { margin-bottom: 0; }
  pre {
    background: #0c0f17; border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 15px; overflow-x: auto;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
    white-space: pre; margin: 10px 0;
  }
  code { font-family: var(--mono); background: var(--bg3); padding: 1.5px 6px; border-radius: 5px; font-size: 12.5px; color: #c8d3f5; }
  pre code { background: none; padding: 0; color: inherit; }
  a { color: var(--accent); }

  /* tool cards */
  .tool {
    margin: 10px 0; border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; background: var(--bg2);
  }
  .tool .head {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 13px; font-family: var(--mono); font-size: 12px;
    cursor: pointer; user-select: none;
  }
  .tool .head:hover { background: var(--bg3); }
  .tool .head .icon { color: var(--cyan); }
  .tool .head .name { color: var(--cyan); font-weight: 600; }
  .tool .head .args { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .tool .head .badge { font-size: 10px; padding: 2px 9px; border-radius: 20px; background: var(--bg4); color: var(--dim); white-space: nowrap; }
  .tool .head .badge.ok { color: var(--green); background: rgba(143,227,168,.08); }
  .tool .head .badge.denied { color: var(--red); background: rgba(255,122,144,.08); }
  .tool .head .badge.pending { color: var(--yellow); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .tool .detail { display: none; padding: 0 13px 11px; font-family: var(--mono); font-size: 12px; }
  .tool.open .detail { display: block; }
  .tool .detail .label { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin: 8px 0 4px; }
  .tool .detail pre { max-height: 340px; overflow-y: auto; white-space: pre-wrap; margin: 0; }
  .approvals { display: flex; gap: 8px; padding: 10px 13px; border-top: 1px solid var(--border); background: rgba(245,194,107,.03); }
  .approvals button {
    padding: 5px 14px; font-size: 12px; border-radius: 7px;
    background: transparent; border: 1px solid var(--border2); color: var(--fg); cursor: pointer;
  }
  .approvals .yes { border-color: rgba(143,227,168,.5); color: var(--green); }
  .approvals .yes:hover { background: rgba(143,227,168,.12); }
  .approvals .no { border-color: rgba(255,122,144,.5); color: var(--red); }
  .approvals .no:hover { background: rgba(255,122,144,.12); }
  .approvals .always { border-color: rgba(245,194,107,.5); color: var(--yellow); }
  .approvals .always:hover { background: rgba(245,194,107,.12); }

  .usage { font-size: 11px; color: var(--faint); margin: 2px 0 14px; font-family: var(--mono); }

  /* council (hidden by default, backend off) */
  .council { margin: 8px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--bg2); }
  .council .head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-family: var(--mono); font-size: 12px; cursor: pointer; }
  .council .detail { display: none; padding: 0 12px 10px; }
  .council.open .detail { display: block; }
  .council .txt { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--dim); background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; margin-top: 6px; }

  footer {
    padding: 10px 20px 18px; position: sticky; bottom: 0;
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
  }
  .composer {
    max-width: 880px; margin: 0 auto;
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 16px; padding: 10px 10px 10px 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within { border-color: rgba(122,162,247,.55); box-shadow: 0 8px 34px rgba(122,162,247,.10); }
  textarea {
    flex: 1; background: transparent; color: var(--fg); border: none; outline: none;
    font: inherit; resize: none; min-height: 26px; max-height: 200px; padding: 4px 0;
  }
  textarea::placeholder { color: var(--faint); }
  #send {
    width: 38px; height: 38px; border-radius: 11px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #0a0c12; font-size: 17px; font-weight: 700; display: grid; place-items: center;
    transition: transform .12s, filter .15s, opacity .15s;
  }
  #send:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
  #send:disabled { opacity: .3; cursor: not-allowed; }
  .status {
    max-width: 880px; margin: 8px auto 0; padding: 0 4px;
    font-size: 11px; color: var(--faint);
    display: flex; justify-content: space-between; gap: 12px;
    font-family: var(--mono);
  }
  .status .busy { color: var(--yellow); }
  .status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }
  .status .busy .dot { background: var(--yellow); animation: pulse 1s infinite; }

  /* empty state */
  .empty { text-align: center; margin-top: 11vh; }
  .empty .mark {
    width: 58px; height: 58px; border-radius: 17px; margin: 0 auto 18px;
    display: grid; place-items: center; font-size: 26px; font-weight: 800; color: #0a0c12;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 10px 40px rgba(122,162,247,.25);
  }
  .empty h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.3px; }
  .empty p { color: var(--dim); font-family: var(--mono); font-size: 12.5px; margin: 0 0 26px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; margin: 0 auto; }
  .chip {
    background: var(--bg2); border: 1px solid var(--border); color: var(--dim);
    border-radius: 20px; padding: 8px 15px; font-size: 12.5px; cursor: pointer;
    transition: all .15s; font-family: var(--mono);
  }
  .chip:hover { color: var(--fg); border-color: var(--border2); background: var(--bg3); transform: translateY(-1px); }

  @media (max-width: 720px) {
    header { padding: 10px 12px; flex-wrap: wrap; }
    .brand .name span { display: none; }
    #model { max-width: 150px; }
    .msg.user { max-width: 92%; }
    .wrap, .composer, .status { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark">a</div><div class="name">a1ma</div></div>
  <div class="picker"><select id="provider" title="provider"></select></div>
  <div class="picker"><select id="model" title="model"></select></div>
  <div class="spacer"></div>
  <button id="sessionsBtn" class="iconbtn" title="saved sessions">sessions</button>
  <button id="exportBtn" class="iconbtn" title="export to markdown">export</button>
  <button id="yolo" class="iconbtn active" title="auto-approve tools">yolo</button>
  <button id="newSession" class="iconbtn danger" title="new session">new</button>
</header>

<div id="chat"><div class="wrap" id="log">
  <div class="empty" id="empty">
    <div class="mark">a</div>
    <h1>a1ma</h1>
    <p>agent online — pick a model, then ask anything</p>
    <div class="chips">
      <div class="chip" data-p="explain this codebase and its architecture">explain this codebase</div>
      <div class="chip" data-p="review the last git commits for security issues">review for security issues</div>
      <div class="chip" data-p="write unit tests for the core module">write unit tests</div>
      <div class="chip" data-p="list the files here and summarize what this project does">summarize this project</div>
    </div>
  </div>
</div></div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="message a1ma…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send" title="send">↑</button>
  </div>
  <div class="status">
    <span id="modelText"></span>
    <span id="statusText"><span class="dot"></span>ready</span>
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);
const log = $("#log"), input = $("#input"), sendBtn = $("#send");
let busy = false, abortCtrl = null, pendingStream = null;

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function md(src) {
  let out = "", i = 0;
  while (i < src.length) {
    const fence = src.indexOf("```", i);
    if (fence === -1) { out += inline(src.slice(i)); break; }
    out += inline(src.slice(i, fence));
    const langEnd = src.indexOf("\n", fence);
    const lang = src.slice(fence + 3, langEnd === -1 ? fence + 3 : langEnd).trim();
    const close = src.indexOf("```", langEnd === -1 ? fence + 3 : langEnd + 1);
    const code = src.slice(langEnd + 1, close === -1 ? src.length : close);
    out += `<pre><code${lang ? ` class="lang-${esc(lang)}"` : ""}>${esc(code.replace(/\n$/, ""))}</code></pre>`;
    i = close === -1 ? src.length : close + 3;
  }
  return out;
}
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|\W)\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/(^|\W)_([^_\n]+)_/g, "$1<i>$2</i>");
}

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function scrollDown() { const c = $("#chat"); c.scrollTop = c.scrollHeight; }
function removeEmpty() { const e = $("#empty"); if (e) e.remove(); }

function addMsg(role) {
  removeEmpty();
  const row = el(`<div class="row ${role}"></div>`);
  const m = el(`<div class="msg ${role}"><div class="who">${role === "user" ? "you" : "a1ma"}</div><div class="body"></div></div>`);
  row.appendChild(m);
  log.appendChild(row);
  scrollDown();
  return m.querySelector(".body");
}
function addError(text) {
  removeEmpty();
  const m = el(`<div class="row"><div class="msg error"><div class="who">error</div><div class="body">${esc(text)}</div></div></div>`);
  log.appendChild(m);
  scrollDown();
}

function addToolCard(id, name, args) {
  removeEmpty();
  const card = el(`
    <div class="tool" data-id="${esc(id)}">
      <div class="head">
        <span class="icon">⚙</span><span class="name">${esc(name)}</span>
        <span class="args">${esc(JSON.stringify(args))}</span>
        <span class="badge pending">running</span>
      </div>
      <div class="detail"></div>
    </div>`);
  card.querySelector(".head").addEventListener("click", () => card.classList.toggle("open"));
  log.appendChild(card);
  scrollDown();
  return card;
}

async function loadState() {
  const s = await (await fetch("/api/state")).json();
  $("#yolo").classList.toggle("active", s.yolo);
  const prov = $("#provider");
  prov.innerHTML = (s.providers || []).map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
  prov.value = s.provider;
  $("#model").value = s.model;
  updateStatus(s);
  return s;
}
function updateStatus(s) {
  const model = s?.model ?? $("#model").value;
  const prov = s?.provider ?? $("#provider").value;
  $("#modelText").textContent = `${prov} · ${model}` + (s?.session_id ? `  ·  ${s.session_id}` : "");
}
async function loadModels() {
  try {
    const { models } = await (await fetch("/api/models")).json();
    const sel = $("#model");
    const cur = sel.value;
    sel.innerHTML = models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
    if (cur && models.includes(cur)) sel.value = cur;
  } catch (e) { /* keep current */ }
}

async function streamChat(content) {
  abortCtrl = new AbortController();
  setBusy(true);
  const body = addMsg("assistant");
  let text = "", rendered = "";
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content }),
      signal: abortCtrl.signal,
    });
    if (!resp.ok) { addError(`HTTP ${resp.status}: ${(await resp.text()).slice(0, 300)}`); setBusy(false); return; }
    pendingStream = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await pendingStream.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!chunk.startsWith("data: ")) continue;
        const ev = JSON.parse(chunk.slice(6));
        if (ev.type === "text") {
          text += ev.text;
          body.innerHTML = md(text);
          scrollDown();
        } else {
          handleEvent(ev);
        }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") addError(String(e));
  } finally {
    setBusy(false);
    abortCtrl = null;
    body.innerHTML = md(text);
    scrollDown();
  }
}

let councilCard = null, councilStages = {};

function addCouncilCard(info) {
  removeEmpty();
  councilCard = el(`
    <div class="council open">
      <div class="head"><span>⇄</span><span>council</span>
        <span style="color:var(--dim)">${esc(info.model_a)} × ${esc(info.model_b)}</span></div>
      <div class="detail"></div>
    </div>`);
  councilCard.querySelector(".head").addEventListener("click", () => councilCard.classList.toggle("open"));
  log.appendChild(councilCard);
  councilStages = {};
  scrollDown();
}
function councilText(ev) {
  const key = ev.member + ":" + ev.phase;
  let stage = councilStages[key];
  if (!stage) {
    stage = el(`<div><div class="label" style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-top:8px">${esc(ev.member)} · ${esc(ev.phase)} · ${esc(ev.model)}</div><div class="txt"></div></div>`);
    councilCard.querySelector(".detail").appendChild(stage);
    councilStages[key] = stage;
  }
  stage.querySelector(".txt").textContent += ev.text;
  scrollDown();
}

function handleEvent(ev) {
  if (ev.type === "turn_usage") {
    const u = document.createElement("div");
    u.className = "usage";
    const { total_tokens: total, requests: count,
            prompt_tokens: prompt, completion_tokens: completion } = ev.usage;
    u.textContent = Number.isFinite(total)
      ? (Number.isFinite(prompt) && Number.isFinite(completion)
          ? `${total.toLocaleString()} tokens across ${count} model calls — prompt ${prompt.toLocaleString()} / completion ${completion.toLocaleString()}`
          : `${total.toLocaleString()} tokens across ${count} model calls`)
      : `Token usage unavailable across ${count} model calls`;
    log.appendChild(u); scrollDown();
  } else if (ev.type === "error") {
    addError(ev.message);
  } else if (ev.type === "council_info") {
    addCouncilCard(ev);
  } else if (ev.type === "council") {
    if (councilCard) councilText(ev);
  } else if (ev.type === "council_done") {
    councilCard = null;
  } else if (ev.type === "tool_request") {
    addToolCard(ev.id, ev.name, ev.args);
  } else if (ev.type === "approval_pending") {
    const card = document.querySelector(`.tool[data-id="${CSS.escape(ev.id)}"]`);
    if (card) {
      const badge = card.querySelector(".badge");
      badge.className = "badge pending";
      badge.textContent = "awaiting approval";
      const bar = el(`
        <div class="approvals">
          <button class="yes">approve</button>
          <button class="always">always allow ${esc(ev.name)}</button>
          <button class="no">deny</button>
        </div>`);
      bar.querySelector(".yes").onclick = () => sendApproval(ev.id, true, false, card);
      bar.querySelector(".always").onclick = () => sendApproval(ev.id, true, true, card);
      bar.querySelector(".no").onclick = () => sendApproval(ev.id, false, false, card);
      card.appendChild(bar);
      scrollDown();
    }
  } else if (ev.type === "tool_result") {
    const card = document.querySelector(`.tool[data-id="${CSS.escape(ev.id)}"]`);
    if (card) {
      const badge = card.querySelector(".badge");
      const denied = ev.result === "denied by operator";
      badge.className = "badge " + (denied ? "denied" : "ok");
      badge.textContent = denied ? "denied" : "done";
      card.querySelector(".detail").innerHTML =
        `<div class="label">result</div><pre>${esc(ev.result)}</pre>`;
      card.querySelectorAll(".approvals").forEach(b => b.remove());
      scrollDown();
    }
  }
}

async function sendApproval(id, allowed, always, card) {
  card.querySelectorAll(".approvals").forEach(b => b.remove());
  const badge = card.querySelector(".badge");
  badge.className = "badge pending"; badge.textContent = "running";
  await fetch("/api/approve", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, allowed, always }),
  });
}

function setBusy(b) {
  busy = b;
  sendBtn.disabled = b;
  sendBtn.textContent = b ? "·" : "↑";
  $("#statusText").innerHTML = b
    ? '<span class="busy"><span class="dot"></span>working…</span>'
    : '<span class="dot"></span>ready';
}

async function send() {
  const content = input.value.trim();
  if (!content || busy) return;
  input.value = ""; input.style.height = "auto";
  addMsg("user").textContent = content;
  await streamChat(content);
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
});
document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => {
    input.value = c.dataset.p;
    input.focus();
    input.dispatchEvent(new Event("input"));
  });
});

$("#newSession").addEventListener("click", async () => {
  if (busy) abortCtrl?.abort();
  await fetch("/api/new", { method: "POST" });
  log.innerHTML = `<div class="empty" id="empty">
    <div class="mark">a</div><h1>a1ma</h1>
    <p>agent online — pick a model, then ask anything</p></div>`;
});

$("#yolo").addEventListener("click", async () => {
  const on = !$("#yolo").classList.contains("active");
  await fetch("/api/yolo", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ on }),
  });
  $("#yolo").classList.toggle("active", on);
});

$("#model").addEventListener("change", async () => {
  await fetch("/api/model", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: $("#model").value }),
  });
  updateStatus();
});

$("#provider").addEventListener("change", async () => {
  const r = await (await fetch("/api/provider", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ provider: $("#provider").value }),
  })).json();
  if (!r.ok) { addError("provider switch failed"); return; }
  $("#model").innerHTML = `<option>${esc(r.model)}</option>`;
  await loadModels();
  $("#model").value = r.model;
  updateStatus({ provider: r.provider, model: r.model });
  if (!r.has_key) addError(`no API key stored for ${r.provider}`);
});

$("#exportBtn").addEventListener("click", async () => {
  const r = await (await fetch("/api/export", { method: "POST" })).json();
  if (r.ok) {
    const m = el(`<div class="row"><div class="msg assistant"><div class="who">a1ma</div><div class="body">exported → <code>${esc(r.path)}</code></div></div></div>`);
    log.appendChild(m); scrollDown();
  }
});

$("#sessionsBtn").addEventListener("click", async () => {
  const { sessions } = await (await fetch("/api/sessions")).json();
  if (!sessions.length) {
    log.appendChild(el(`<div class="row"><div class="msg assistant"><div class="who">a1ma</div><div class="body">no saved sessions yet</div></div></div>`));
    scrollDown(); return;
  }
  removeEmpty();
  const box = el(`<div class="tool open"><div class="head"><span class="icon">☰</span><span class="name">saved sessions</span></div><div class="detail"></div></div>`);
  const detail = box.querySelector(".detail");
  for (const s of sessions) {
    const row = el(`<div style="padding:4px 0"><button style="width:100%;text-align:left;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--fg);cursor:pointer;font-size:12px;font-family:var(--mono)"><b>${esc(s.id)}</b> · ${s.messages} msgs · ${esc(s.preview || "")}</button></div>`);
    row.querySelector("button").addEventListener("click", async () => {
      const r = await (await fetch("/api/resume", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: s.id }),
      })).json();
      if (r.ok) {
        log.innerHTML = "";
        log.appendChild(el(`<div class="row"><div class="msg assistant"><div class="who">a1ma</div><div class="body">resumed <code>${esc(s.id)}</code> — ${r.messages} messages in context. keep chatting.</div></div></div>`));
        scrollDown();
        loadState();
      }
    });
    detail.appendChild(row);
  }
  log.appendChild(box); scrollDown();
});

loadState().then(loadModels);
input.focus();
</script>
</body>
</html>
